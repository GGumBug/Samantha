name = "unity-reviewer"
description = "Unity 구현 결과를 독립적으로 검증하는 읽기 전용 리뷰어. 회귀, 누락된 호출부, 테스트 적합성, 직렬화·라이프사이클·race 위험을 점검할 때 사용합니다."
sandbox_mode = "read-only"
